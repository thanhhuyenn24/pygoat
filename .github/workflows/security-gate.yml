# Security gate for this application. Copy to .github/workflows/security-gate.yml.
# Needs repository secrets:
#   GATE_REPO_TOKEN  read access to thanhhuyenn24/securitygate-cicd
#   NVD_API_KEY      NVD API key (Layer 2 CVSS lookups; avoids low rate limit)
#   HF_TOKEN         Hugging Face read token for the private model repo (Layer 1)
# Optional repository variables:
#   GATE_REF            branch of securitygate-cicd to use (default branch if unset)
#   DEPLOYMENT_CONTEXT  internet-facing (default) or internal
#   MODEL_REVISION      pin the CodeBERT model commit (defaults to the one baked into predict.py)
#   MODEL_SUBFOLDER     subfolder of the model repo to load (default "final": the production
#                        model trained on all 53,708 samples; "fold{N}" are 5-fold CV checkpoints)
#
# Layout: Layer 1 (secrets) and Layer 2 (dependency CVE) run as independent parallel
# jobs — they don't depend on each other's output, only `gate` needs both. Wall-clock
# time is therefore ~max(layer1, layer2) + gate overhead instead of layer1 + layer2.
#
# CAUTION: gitleaks.json / secret-report.json are uploaded as artifacts and contain
# the raw matched secret text. Anyone with read access to this repo's Actions runs
# can download them. Acceptable for a deliberately-vulnerable app like PyGoat; for
# a real application, restrict who can read Actions artifacts or stop uploading
# gitleaks.json/secret-report.json (keep only the redacted gate-decision.json).
name: security-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # job-level `permissions:` below narrows/extends this per job

env:
  OSV_SCANNER_VERSION: "2.6.0"
  GITLEAKS_VERSION: "8.21.2"
  DEPLOYMENT_CONTEXT: ${{ vars.DEPLOYMENT_CONTEXT || 'internet-facing' }}
  MODEL_REVISION: ${{ vars.MODEL_REVISION || 'f0e541ae85af2cda85de525cbe36bc34f12854a9' }}
  MODEL_SUBFOLDER: ${{ vars.MODEL_SUBFOLDER || 'final' }}

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Layer 1: secret scanning + context-aware classification ----
  secrets-scan:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out security gate
        uses: actions/checkout@v6
        with:
          repository: thanhhuyenn24/securitygate-cicd
          ref: ${{ vars.GATE_REF }}
          token: ${{ secrets.GATE_REPO_TOKEN }}
          path: securitygate
          sparse-checkout: |
            layer1-nlp
            gate-decision

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: securitygate/layer1-nlp/requirements-inference.txt

      - name: Install gate dependencies
        run: pip install -r securitygate/layer1-nlp/requirements-inference.txt

      # Cache the model by revision so only the first run per cache generation downloads it (~500 MB).
      - name: Cache CodeBERT model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-codebert-secret-${{ env.MODEL_REVISION }}

      - name: Cache Gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-linux_x64

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true'
        run: |
          # keep the release's original filename: sha256sum -c matches entries by name,
          # and with --ignore-missing a renamed file would mean nothing gets verified (exit 1)
          curl -sSfL -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod +x gitleaks

      - name: Verify Gitleaks
        run: ./gitleaks version

      - name: Scan secrets (Gitleaks)
        run: |
          set +e
          ./gitleaks detect --source app --no-git --report-format json --report-path gitleaks.json
          status=$?
          set -e
          # 0 = no leaks, 1 = leaks found (expected); >1 means Gitleaks itself failed
          if [ "$status" -gt 1 ]; then
            echo "Gitleaks failed with exit code $status"
            exit "$status"
          fi

      - name: Classify secrets (Layer 1)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python securitygate/layer1-nlp/src/predict.py gitleaks.json
          --source app
          --revision "$MODEL_REVISION"
          --subfolder "$MODEL_SUBFOLDER"
          --output secret-report.json

      - name: Upload secret report
        if: always()  # e.g. classify step fails on a missing HF_TOKEN: still keep gitleaks.json for debugging
        uses: actions/upload-artifact@v6
        with:
          name: layer1-secret-report
          path: |
            gitleaks.json
            secret-report.json
          if-no-files-found: ignore

  # ---- Layer 2: dependency CVE risk scoring ----
  deps-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out security gate
        uses: actions/checkout@v6
        with:
          repository: thanhhuyenn24/securitygate-cicd
          ref: ${{ vars.GATE_REF }}
          token: ${{ secrets.GATE_REPO_TOKEN }}
          path: securitygate
          sparse-checkout: |
            layer2-risk-engine
            gate-decision

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: securitygate/layer2-risk-engine/requirements.txt

      - name: Install gate dependencies
        run: pip install -r securitygate/layer2-risk-engine/requirements.txt

      - name: Cache OSV-Scanner binary
        id: cache-osv
        uses: actions/cache@v4
        with:
          path: osv-scanner
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux_amd64

      - name: Install OSV-Scanner
        if: steps.cache-osv.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner

      - name: Verify OSV-Scanner
        run: ./osv-scanner --version

      - name: Scan dependencies (OSV-Scanner)
        run: |
          set +e
          ./osv-scanner scan source -r app --format json --output osv.json
          status=$?
          set -e
          # 0 = no findings, 1 = findings; 127/128 mean the scan itself failed
          if [ "$status" -gt 1 ]; then
            echo "OSV-Scanner failed with exit code $status"
            exit "$status"
          fi

      - name: Score findings (Layer 2)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python securitygate/layer2-risk-engine/src/osv_adapter.py osv.json --output layer2-report.json

      - name: Upload dependency report
        if: always()  # e.g. scoring step fails on an NVD outage: still keep osv.json for debugging
        uses: actions/upload-artifact@v6
        with:
          name: layer2-dependency-report
          path: |
            osv.json
            layer2-report.json
          if-no-files-found: ignore

  # ---- Policy Matrix: combine both layers, decide PASS/WARN/BLOCK ----
  gate:
    needs: [secrets-scan, deps-scan]
    if: always()  # still need to decide/comment even if one layer step failed
    permissions:
      contents: read
      pull-requests: write   # post the gate result as a PR comment
    runs-on: ubuntu-24.04
    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          path: app

      - name: Check out security gate
        uses: actions/checkout@v6
        with:
          repository: thanhhuyenn24/securitygate-cicd
          ref: ${{ vars.GATE_REF }}
          token: ${{ secrets.GATE_REPO_TOKEN }}
          path: securitygate
          sparse-checkout: |
            gate-decision

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No continue-on-error: if a layer's job failed to produce its artifact,
      # this step fails here with a clear message instead of gate.py crashing
      # later on a missing secret-report.json/layer2-report.json (gate.py always
      # treats --secret-report as "present" once the flag is passed, regardless
      # of whether the file actually exists).
      - name: Download Layer 1 report
        uses: actions/download-artifact@v6
        with:
          name: layer1-secret-report

      - name: Download Layer 2 report
        uses: actions/download-artifact@v6
        with:
          name: layer2-dependency-report

      - name: Gate decision
        id: gate
        run: >-
          python securitygate/gate-decision/gate.py layer2-report.json
          --secret-report secret-report.json
          --context "$DEPLOYMENT_CONTEXT"
          --policy securitygate/gate-decision/policy.yaml
          --root app
          --summary "$GITHUB_STEP_SUMMARY"
          --output gate-decision.json

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Security Gate\n_No report produced._';
            try {
              const r = JSON.parse(fs.readFileSync('gate-decision.json', 'utf8'));
              const rows = r.findings.filter(f => f.decision !== 'PASS').slice(0, 30)
                .map(f => `| ${f.decision} | ${f.layer} | ${f.package} | ${f.class} | ${f.reason.replace(/\|/g,'/')} |`)
                .join('\n');
              body = `## Security Gate: **${r.decision}**\n\n`
                + `Context \`${r.context}\` — BLOCK ${r.counts.BLOCK}, WARN ${r.counts.WARN}, PASS ${r.counts.PASS}\n\n`
                + (rows ? `| Decision | Layer | Package/File | Class | Reason |\n|---|---|---|---|---|\n${rows}` : '_No BLOCK/WARN findings._');
            } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

      - name: Upload final gate decision
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-gate-decision
          path: gate-decision.json
          if-no-files-found: ignore
